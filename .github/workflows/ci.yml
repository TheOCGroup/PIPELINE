name: PIPELINE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test PIPELINE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Check runtime entrypoints
        run: |
          node --check server.js
          node --check src/http/routes/dealFindrIntake.js
          node --check src/repositories/sqlite/sqliteRepositories.js
