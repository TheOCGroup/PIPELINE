<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aiden | Messages Inbox</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17334a;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}header{padding:23px 6%;background:white;border-bottom:1px solid #e0e8eb}h1{font-size:24px;margin:0}header p{color:#637581;margin:6px 0 0}main{max-width:1100px;margin:24px auto;padding:0 20px}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}button{border:none;background:#235e81;color:white;padding:11px 18px;border-radius:9px;cursor:pointer}button.secondary{background:#e3edf1;color:#17334a}input{border:1px solid #cbd9e0;border-radius:9px;padding:11px;min-width:240px;flex:1}#notice{color:#667a86;margin:10px 0}.layout{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px}.panel{background:#fff;border:1px solid #dae4e9;border-radius:14px;min-height:320px;padding:18px}.item{display:block;width:100%;border:1px solid #e1e8ed;border-radius:10px;background:white;text-align:left;margin:10px 0;padding:13px;color:#17334a}.item.selected{border-color:#3d91a5;background:#edf7f7}.item strong{display:block}.sub{font-size:13px;color:#6b7c88;margin-top:4px}.message{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:99px;padding:4px 10px;background:#e8f2f5;font-size:12px;margin:4px 5px 4px 0}.field{margin:13px 0}.field b{display:block;font-size:13px;color:#5d7382;margin-bottom:4px}a{color:#246a86}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{min-height:0}}</style></head><body>
<header><h1>Aiden · Messages Inbox</h1><p>The OC Group / OCG LAB — caller messages and follow-ups</p></header>
<main><div class="bar"><input id="search" placeholder="Search name, number, or message" aria-label="Search messages"><button id="refresh">Refresh</button><button class="secondary" id="access">Inbox access</button></div>
<div id="notice" role="status">Sign in with your Aiden inbox access code or existing Pipeline operator access to view messages.</div>
<div class="layout"><section class="panel"><strong>Recent calls</strong><div id="list"></div></section><section class="panel" id="detail"><p>Select a call to see its information.</p></section></div></main>
<script>
(()=>{'use strict';let records=[],selected=null;const $=id=>document.getElementById(id);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayTime=x=>{const d=new Date(x?.receivedAt||x?.createdAt||'');return Number.isFinite(+d)?d.toLocaleString():'Time unknown'};
function access(){const secret=prompt('Enter your Aiden inbox access code (stored only in this browser tab):');if(secret!==null){sessionStorage.setItem('pipeline_operator_secret',secret.trim());refresh()}}
function render(){const q=$('search').value.trim().toLowerCase();const shown=records.filter(x=>[x.callerName,x.from,x.phone,x.message,x.callerIntent,x.businessArea].some(v=>String(v||'').toLowerCase().includes(q)));
$('list').innerHTML=shown.length?shown.map((x,i)=>{const id=records.indexOf(x);return '<button class="item '+(id===selected?'selected':'')+'" data-id="'+id+'"><strong>'+escape(x.callerName||x.from||'Unknown caller')+'</strong><span class="sub">'+escape(displayTime(x))+' · '+escape(x.businessArea||'General')+'</span><div class="sub">'+escape(String(x.message||'No message').slice(0,115))+'</div></button>'}).join(''):'<p class="sub">No matching calls.</p>';
$('list').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.id);render()}));
const x=records[selected];if(!x){$('detail').innerHTML='<p>Select a call to view the message.</p>';return}
const fields=[['Phone',x.phone||x.from],['Company',x.company],['Business',x.businessArea],['Reason for calling',x.callerIntent],['Urgency',x.urgency],['Preferred callback',x.preferredCallbackTime],['Property address',x.propertyAddress],['Property condition',x.propertyCondition],['Next action',x.requestedNextAction],['Email',x.email]];
$('detail').innerHTML='<h2>'+escape(x.callerName||'Caller details')+'</h2><div class="sub">'+escape(displayTime(x))+'</div><h3>Message</h3><div class="message">'+escape(x.message||'No message available')+'</div>'+fields.filter(([k,v])=>v!==null&&v!==undefined&&String(v).trim()!=='').map(([k,v])=>'<div class="field"><b>'+escape(k)+'</b>'+escape(v)+'</div>').join('');}
async function refresh(){let secret=sessionStorage.getItem('pipeline_operator_secret');if(!secret){$('notice').textContent='Select Inbox access to enter your Aiden access code.';return}
try{const r=await fetch('/api/v1/aiden/messages',{headers:{Authorization:'Bearer '+secret},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Access denied. Re-enter your inbox access code.':'Inbox unavailable ('+r.status+').');const j=await r.json();records=Array.isArray(j.messages)?j.messages:[];selected=records.length?0:null;$('notice').textContent=records.length+' recent call record(s) loaded.';render()}catch(e){$('notice').textContent=e.message;records=[];selected=null;render()}}
$('refresh').addEventListener('click',refresh);$('access').addEventListener('click',access);$('search').addEventListener('input',render);refresh();
})();
</script></body></html>
